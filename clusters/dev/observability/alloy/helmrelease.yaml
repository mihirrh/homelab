apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 1h

  install:
    createNamespace: true
    timeout: 10m

  upgrade:
    timeout: 10m
    cleanupOnFail: true

  chart:
    spec:
      chart: alloy
      version: "1.1.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  values:
    alloy:
      # Alloy config is templated from the ConfigMap created below (alloy-config.yaml).
      # The chart mounts the 'alloy' key from the config secret/configmap.
      configMap:
        create: false
        name: alloy-config
        key: config.alloy

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi

    controller:
      type: daemonset   # Run on every node to collect all pod logs

    serviceAccount:
      create: true
      name: alloy

    # RBAC so Alloy can read pod metadata for log enrichment
    rbac:
      create: true

    # Disable bundled self-monitoring (we have kube-prometheus-stack already)
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
