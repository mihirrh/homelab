apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-alloy
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev/observability/alloy
  prune: true
  wait: true
  dependsOn:
    # Alloy must start after Loki so the push endpoint is ready
    - name: observability-loki
