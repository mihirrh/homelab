apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 1h

  install:
    createNamespace: true
    timeout: 15m

  upgrade:
    timeout: 15m
    cleanupOnFail: true

  chart:
    spec:
      chart: loki
      version: "6.30.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: filesystem

      limits_config:
        retention_period: 336h   # 14 days
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 6
        max_streams_per_user: 10000
        max_chunks_per_query: 2000000

      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
      persistence:
        enabled: true
        size: 10Gi
        accessModes:
          - ReadWriteOnce

    # Disable all distributed-mode components
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Disable memcached caches — not needed for single-binary homelab
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    # Lightweight nginx gateway
    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 32Mi

    # Disable all bundled monitoring/test components
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false

    test:
      enabled: false
