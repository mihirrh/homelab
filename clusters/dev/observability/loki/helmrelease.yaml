apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 1h

  install:
    createNamespace: true
    timeout: 15m

  upgrade:
    timeout: 15m
    cleanupOnFail: true

  chart:
    spec:
      chart: loki
      # loki-6.x is the current SimpleScalable/SingleBinary chart; pin to stable
      version: "6.30.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  values:
    # ---------------------------------------------------------------
    # Single-binary mode — one pod runs all Loki components.
    # Perfect for a homelab; no Kafka, no object storage dependency.
    # ---------------------------------------------------------------
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      commonConfig:
        replication_factor: 1

      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: filesystem

      limits_config:
        retention_period: 336h   # 14 days
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 6
        max_streams_per_user: 10000
        max_chunks_per_query: 2000000

      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

      persistence:
        enabled: true
        size: 10Gi
        accessModes:
          - ReadWriteOnce

    # Disable components that only make sense in distributed mode
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Gateway (nginx) routes /loki/* to the single-binary pod
    gateway:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Disable the bundled Grafana Agent (we use Alloy instead)
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      lokiCanary:
        enabled: false

    test:
      enabled: false
