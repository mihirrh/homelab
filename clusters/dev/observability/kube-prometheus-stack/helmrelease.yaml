apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace
    timeout: 15m

  upgrade:
    crds: CreateReplace
    timeout: 15m
    cleanupOnFail: true

  chart:
    spec:
      chart: kube-prometheus-stack
      # Latest stable as of 2025-07; compatible with Kubernetes v1.30+
      version: "75.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system

  values:
    # ---------------------------------------------------------------
    # Global
    # ---------------------------------------------------------------
    fullnameOverride: kube-prometheus-stack
    namespaceOverride: monitoring

    # ---------------------------------------------------------------
    # Prometheus
    # ---------------------------------------------------------------
    prometheus:
      prometheusSpec:
        retention: 14d
        retentionSize: "8GB"

        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

        # Scrape all PodMonitor / ServiceMonitor resources across all namespaces
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false

    # ---------------------------------------------------------------
    # Grafana
    # ---------------------------------------------------------------
    grafana:
      enabled: true

      # Admin credentials — override via a Kubernetes Secret (see grafana-secret.yaml)
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password

      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

      persistence:
        enabled: true
        size: 5Gi
        accessModes:
          - ReadWriteOnce

      # ClusterIP only — exposed through Envoy Gateway HTTPRoute
      service:
        type: ClusterIP
        port: 80

      # Sidecar picks up ConfigMaps labelled grafana_datasource=1
      sidecar:
        datasources:
          enabled: true
          label: grafana_datasource
          labelValue: "1"
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL

      # Datasources provisioned automatically
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki-gateway.logging.svc.cluster.local
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 1000
            derivedFields:
              - datasourceUid: prometheus
                matcherRegex: "traceID=(\\w+)"
                name: TraceID
                url: "$${__value.raw}"

      grafana.ini:
        server:
          domain: grafana.mihir.uk
          root_url: "https://grafana.mihir.uk"
        security:
          # Credentials are in grafana-admin-secret
          disable_initial_admin_creation: false
        analytics:
          reporting_enabled: false
          check_for_updates: false

    # ---------------------------------------------------------------
    # Alertmanager
    # ---------------------------------------------------------------
    alertmanager:
      enabled: true

      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

      config:
        global:
          resolve_timeout: 5m

        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - matchers:
                - alertname =~ "InfoInhibitor|Watchdog"
              receiver: "null"

        receivers:
          - name: "null"

        inhibit_rules:
          - source_matchers:
              - severity = "critical"
            target_matchers:
              - severity =~ "warning|info"
            equal: ["alertname", "namespace", "service"]

    # ---------------------------------------------------------------
    # kube-state-metrics
    # ---------------------------------------------------------------
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # ---------------------------------------------------------------
    # node-exporter
    # ---------------------------------------------------------------
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # ---------------------------------------------------------------
    # Disable components not needed in homelab
    # ---------------------------------------------------------------
    kubeEtcd:
      enabled: false

    kubeControllerManager:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeProxy:
      enabled: false

    # ---------------------------------------------------------------
    # Default alert rules — keep most, suppress noisy ones
    # ---------------------------------------------------------------
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: false
        configReplicationController: false
        kubeApiserverAvailability: true
        kubeApiserverBurnrate: true
        kubeApiserverHistogram: true
        kubeApiserverSlos: true
        kubelet: true
        kubePrometheusGeneral: true
        kubePrometheusNodeRecording: true
        kubernetesApps: true
        kubernetesResources: true
        kubernetesStorage: true
        kubernetesSystem: true
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true
