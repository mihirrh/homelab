apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # clusterissuer.yaml lives here (not in cert-manager/) because cert-manager CRDs
  # must already exist when this bundle is dry-run. The infra-gateway-api Flux
  # Kustomization dependsOn infra-cert-manager (wait: true), guaranteeing CRDs exist
  # before kustomize-controller dry-runs this bundle.
  - clusterissuer.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - certificate.yaml