apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # clusterissuer.yaml is intentionally excluded here.
  # ClusterIssuer requires cert-manager CRDs which are only available after the
  # HelmRelease above completes. It is applied by the infra-gateway-api Flux
  # Kustomization which dependsOn infra-cert-manager (wait: true).