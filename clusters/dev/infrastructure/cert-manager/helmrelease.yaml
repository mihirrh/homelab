apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager

spec:
  interval: 1h

  install:
    createNamespace: true

  chart:
    spec:
      chart: cert-manager
      version: "v1.18.2"

      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system

  values:
    crds:
      enabled: true
    extraArgs:
      - --enable-gateway-api
      # Use public DNS for HTTP-01 self-checks.
      # The cluster's CoreDNS cannot resolve external hostnames (Rackspace Spot
      # network restriction), so cert-manager must use an external resolver to
      # pre-validate that the ACME challenge token is reachable before submitting
      # to Let's Encrypt.
      - --acme-http01-solver-nameservers=8.8.8.8:53,1.1.1.1:53