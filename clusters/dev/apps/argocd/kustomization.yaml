apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # application.yaml is intentionally excluded.
  # The ArgoCD Application pointed at clusters/dev creates a dual-management
  # conflict: both Flux and Argo CD would reconcile the same resources.
  # Argo CD is installed here for its UI only. Add Application CRs here only
  # for paths that Flux does NOT already manage.