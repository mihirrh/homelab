# HTTPRoute for it-tools that Argo Rollouts will manipulate.
# Replaces the original it-tools HTTPRoute (which pointed directly at the
# it-tools Service).  After migration, traffic is split between
# it-tools-stable and it-tools-canary using HTTPRoute backendRefs weights.
#
# The Argo Rollouts Gateway API plugin updates the weights on these two
# backendRefs as the canary progresses.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: it-tools
  namespace: default
  # This annotation tells Argo Rollouts which HTTPRoute to manage
  annotations:
    argo-rollouts.argoproj.io/managed-by-rollouts: "true"
spec:
  parentRefs:
    - name: it-tools-gateway
      namespace: default
  hostnames:
    - "it-tools.mihir.uk"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Weights are managed by Argo Rollouts.
        # Initial state: 100% stable, 0% canary.
        - name: it-tools-stable
          port: 80
          weight: 100
        - name: it-tools-canary
          port: 80
          weight: 0
