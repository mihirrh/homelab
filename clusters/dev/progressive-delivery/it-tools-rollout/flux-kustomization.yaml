apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: progressive-delivery-it-tools-rollout
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/dev/progressive-delivery/it-tools-rollout
  prune: true
  wait: true
  dependsOn:
    # Rollout CRDs must exist before this Kustomization runs
    - name: progressive-delivery-argo-rollouts
    # Gateway must be up so the HTTPRoute is valid
    - name: infra-gateway-api
    # Prometheus must be up for AnalysisTemplate metrics
    - name: observability-kube-prometheus-stack
