apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-rollouts
  namespace: argo-rollouts
spec:
  interval: 1h

  install:
    createNamespace: true
    crds: CreateReplace
    timeout: 10m

  upgrade:
    crds: CreateReplace
    timeout: 10m
    cleanupOnFail: true

  chart:
    spec:
      chart: argo-rollouts
      version: "2.40.0"
      sourceRef:
        kind: HelmRepository
        name: argocd
        namespace: flux-system

  # postRenderers patches the Helm-rendered ConfigMap to inject the plugin as a
  # valid JSON array. The chart template uses toYaml which produces YAML block
  # strings; the controller expects JSON — this strategic merge patch replaces
  # the data section with the correct value before Flux applies the manifest.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: argo-rollouts-config
            patch: |
              - op: replace
                path: /data
                value:
                  trafficRouterPlugins: '[{"name":"argoproj-labs/gatewayAPI","location":"https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.6.0/gatewayapi-plugin-linux-amd64"}]'

  values:
    controller:
      replicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi

    dashboard:
      enabled: true
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 64Mi
      service:
        type: ClusterIP
